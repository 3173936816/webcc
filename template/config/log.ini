# ============================================================
# log4cc 日志配置
# ============================================================

[log]
# 全局默认日志级别，可选 trace/debug/info/warn/error/fatal
# 没写 level 的 logger 用它
level = info

# 全局默认格式化 pattern，没写 pattern 的 appender 用它
# 占位符:
#   %l 级别        %p 进程 ID      %t 线程 ID
#   %d 时间        %f 文件名       %n 行号
#   %c logger 名   %m 消息正文     %T 制表符
#   %E 换行        %% 字面量 %
# %d 可带格式: %d{%Y-%m-%d %H:%M:%S}
pattern = [%d{%Y-%m-%d %H:%M:%S}] [%l] [pid:%p] [tid:%t] [%f:%n] [%c] %m%E


# ============================================================
# appender 定义
# 每个 appender 一个小节，[appender.<名字>]
# 名字由你自己定，logger 的 appenders 列表引用这个名字
# ============================================================

[appender.console]
# 输出到控制台
# 必填: type
type = console

# 可选: pattern
# 不写则用 [log] 里的全局 pattern
# pattern = [%d{%H:%M:%S}] [%l] %m%E


[appender.rotating]
# 按大小轮转的文件 appender
# 必填: type, path, size_limit
type = rotating_file

# 日志文件路径，目录不存在会自动创建
path = logs/rotating.log

# 轮转阈值，单位字节。10485760 = 10MB
# 当前文件超过这个大小后，改名为 .1，新文件继续写
size_limit = 10485760

# 可选: pattern
# 不写则用 [log] 里的全局 pattern
# pattern = [%d] [%l] %m%E


# ============================================================
# logger 定义
# 每个 logger 一个小节，[logger.<名字>]
# root 是根 logger，其他名字对应代码里 logger("xxx")
# ============================================================

[logger.root]
# 可选: level
# 不写则用 [log] 里的全局 level
level = info

# 必填: appenders
# 逗号分隔的 appender 名字列表，引用上面 [appender.xxx] 定义的名字
# 一个 logger 可以挂多个 appender，日志会同时写到所有 appender
appenders = console,rotating